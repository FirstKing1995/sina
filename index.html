<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SINA - O Primeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="css/jogo.css?v=16">
<script>
// se um arquivo do jogo não vier (servidor ocupado), tenta de novo até quatro vezes em vez de travar
addEventListener('error', function (e) {
  var t = e.target; if (!t || t.tagName !== 'SCRIPT') return;
  var n = 0; try { n = +sessionStorage.getItem('sina_tenta') || 0; sessionStorage.setItem('sina_tenta', n + 1); } catch (x) { n = 9; }
  var c = document.getElementById('carrega'); if (c) c.textContent = n < 4 ? 'O servidor demorou. Tentando de novo...' : 'Não foi possível carregar. Recarregue a página em instantes.';
  if (n < 4 && !window._tenta) { window._tenta = 1; setTimeout(function () { location.reload(); }, 900 + n * 1200); }
}, true);
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="h-esq">
    <div id="retrato"><canvas id="retrato-c" width="34" height="34"></canvas><b id="h-estado"></b></div>
    <div id="barras">
      <div id="h-titulo"></div>
      <div class="barra vida" id="b-vida"><i></i><u></u><b></b></div>
      <div class="barra" id="b-vigor"><i></i></div>
      <div class="barra" id="b-sina" hidden><i></i></div>
      <div class="dupla"><i class="ico mini" id="ic-fome"></i><div class="barra" id="b-fome"><i></i></div><div id="h-tocha" hidden><i></i></div></div>
      <div id="h-magias"></div>
      <div id="h-hum" hidden><span></span><div class="barra" id="b-hum"><i></i></div><div class="barra" id="b-hfome"><i></i></div><div class="barra" id="b-laco"><i></i></div></div>
    </div>
  </div>
  <div id="h-centro"><canvas id="h-trilho" width="220" height="20"></canvas><div id="h-dia"><i class="ico mini" id="ic-dia"></i><span></span></div><div id="h-meta"></div></div>
  <div id="h-dir"><button data-h="mochila"></button><button data-h="mapa"></button><button data-h="opcoes"></button></div>
  <div id="h-baixo"><div id="h-comida"></div><div id="h-armas"></div></div>
  <div id="chefe" hidden><div id="chefe-nome"></div><div class="barra" id="b-chefe"><i></i><u></u></div></div>
  <button id="usar" hidden></button>
  <div id="guardou"><i class="ico mini" id="ic-guardou"></i>Jogo guardado</div>
  <div id="pegou"></div>
  <div id="sussurro"></div>
  <div id="area"></div>
  <div id="conquista"></div>
  <div id="h-combo" hidden><b>0</b><span>golpes</span></div>
</div>
<div id="girar"><i class="ico" id="ic-girar"></i><b>Vire o aparelho</b><span>O SINA se joga deitado.</span></div>

<div id="toque" hidden>
  <div id="zona-manche"></div><div id="manche"><u></u><i></i></div>
  <div id="botoes">
    <button data-a="golpe"><span class="bi"></span></button><button data-a="golpe2" hidden><span class="bi"></span></button>
    <button data-a="pula"><span class="bi" data-i="pula"></span></button><button data-a="rola"><span class="bi" data-i="rola"></span></button>
    <button data-a="forte"><s></s><span class="bi" data-i="forte"></span></button>
    <button data-a="magia1" hidden><s></s><span class="bi"></span></button><button data-a="magia2" hidden><s></s><span class="bi"></span></button>
    <button data-a="come"><span class="bi" data-i="comer"></span><em>0</em></button><button data-a="tocha" hidden><span class="bi" data-i="tocha"></span></button>
  </div>
</div>
<div id="edita" hidden></div>

<div id="titulo" class="tela">
  <div class="fundo" style="background-image:url(assets/floresta/nasce.webp)"></div>
  <canvas id="titulo-part"></canvas>
  <img id="logo" src="assets/floresta/logo.webp" alt="SINA">
  <p class="sub">O Primeiro</p>
  <div id="titulo-menu" class="menu"><div id="carrega">Moldando o barro...</div></div>
  <div id="memorias"></div>
  <p class="rodape">Versões guardadas: <a href="cima/">vista de cima</a> · <a href="2d-v2/">2D anterior</a></p>
</div>

<div id="nasce" class="tela" hidden>
  <div id="n-img"></div><div id="n-luz"></div><canvas id="n-part"></canvas>
  <p id="n-texto"></p>
  <div id="n-pede" hidden>
    <p>Você existe. Como se chama?</p>
    <input id="n-nome" maxlength="16" autocomplete="off" placeholder="Seu nome">
    <div id="n-niveis"></div><small id="n-ndesc"></small>
    <button id="n-ir" class="ir">Abrir os olhos</button>
  </div>
</div>

<div id="menu" class="tela" hidden>
  <div class="painel">
    <nav id="m-abas"></nav>
    <div class="m-dir">
      <header><div><h1 id="m-titulo"></h1><small id="m-sub"></small></div><button id="m-fechar" title="Fechar"></button></header>
      <div id="m-corpo"></div>
    </div>
  </div>
</div>

<div id="fogo" class="tela" hidden>
  <div class="painel estreito">
    <h2 id="fg-nome"></h2>
    <p class="nota" id="fg-nota"></p>
    <div id="fg-corpo" class="menu"></div>
    <button id="fg-sair" class="ir">Levantar</button>
  </div>
</div>

<div id="batiza" class="tela" hidden>
  <div class="painel estreito">
    <h2>Um choro no meio da noite</h2>
    <p class="nota">É um menino. Que nome ele vai carregar?</p>
    <input id="bt-nome" maxlength="16" autocomplete="off" placeholder="Nome do filho">
    <button id="bt-ir" class="ir">Este é o seu nome</button>
  </div>
</div>

<div id="morte" class="tela" hidden>
  <h1 id="morte-tit"></h1>
  <p id="morte-sub"></p>
  <div id="morte-corpo" class="menu"></div>
</div>
<div id="veu"></div>

<script src="assets/barro/barro.js?v=16"></script>
<script src="assets/barro/gente.js?v=16"></script>
<script src="assets/floresta/arte.js?v=16"></script>
<script src="assets/ui/ui.js?v=16"></script>
<script src="js/som.js?v=16"></script>
<script src="js/dados.js?v=16"></script>
<script src="js/fase.js?v=16"></script>
<script src="js/motor.js?v=16"></script>
<script src="js/bando.js?v=16"></script>
<script src="js/clima.js?v=16"></script>
<script src="js/donos.js?v=16"></script>
<script src="js/lar.js?v=16"></script>
<script src="js/vila.js?v=16"></script>
<script src="js/cidade.js?v=16"></script>
<script src="js/desenho.js?v=16"></script>
<script src="js/vivo.js?v=16"></script>
<script src="js/menu.js?v=16"></script>
<script src="js/toque.js?v=16"></script>
<script src="js/main.js?v=16"></script>
</body>
</html>
