<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SINA - O Primeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="css/jogo.css?v=3">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="retrato"><canvas id="retrato-c" width="34" height="34"></canvas></div>
  <div id="barras">
    <div class="barra" id="b-vida"><i></i><u></u></div>
    <div class="barra" id="b-vigor"><i></i></div>
    <div class="barra" id="b-sina" hidden><i></i></div>
    <div class="barra" id="b-fome"><i></i></div>
    <div id="h-titulo"></div>
  </div>
  <div id="h-magias"></div>
  <div id="h-baixo"><div id="h-comida"></div><div id="h-arma"></div></div>
  <button id="h-mochila" title="Mochila (I)">Mochila</button>
  <div id="chefe" hidden><div id="chefe-nome"></div><div class="barra" id="b-chefe"><i></i><u></u></div></div>
  <div id="usar" hidden></div>
  <div id="sussurro"></div>
  <div id="area"></div>
  <div id="conquista"></div>
  <div id="girar">Gire o aparelho para jogar deitado.</div>
</div>

<div id="toque" hidden>
  <div id="zona-manche"></div><div id="manche"><i></i></div>
  <div id="botoes">
    <button data-a="pula">Pular</button><button data-a="golpe">Golpe</button><button data-a="rola">Esquiva</button>
    <button data-a="forte">Forte</button><button data-a="magia1" hidden>Magia</button><button data-a="magia2" hidden>Magia 2</button>
    <button data-a="come">Comer</button><button data-a="usa">Usar</button><button data-a="arma">Arma</button><button data-a="menu">Mochila</button>
  </div>
</div>

<div id="titulo" class="tela">
  <div class="fundo" style="background-image:url(assets/floresta/nasce.webp)"></div>
  <img id="logo" src="assets/floresta/logo.webp" alt="SINA">
  <p class="sub">O Primeiro</p>
  <div id="titulo-menu" class="menu"><div id="carrega">Moldando o barro...</div></div>
  <div id="memorias"></div>
  <p class="rodape">Versões guardadas: <a href="cima/">vista de cima</a> · <a href="2d-v2/">2D anterior</a></p>
</div>

<div id="nasce" class="tela" hidden>
  <div id="n-img"></div><div id="n-luz"></div><canvas id="n-part"></canvas>
  <p id="n-texto"></p>
  <div id="n-pede" hidden>
    <p>Você existe. Como se chama?</p>
    <input id="n-nome" maxlength="16" autocomplete="off" placeholder="Seu nome">
    <button id="n-ir" class="ir">Abrir os olhos</button>
  </div>
</div>

<div id="menu" class="tela" hidden>
  <div class="caixa">
    <div class="topo"><div id="m-abas"></div><button id="m-fechar">Fechar</button></div>
    <div id="m-corpo"></div>
  </div>
</div>

<div id="fogo" class="tela" hidden>
  <div class="caixa estreita">
    <h2 id="fg-nome"></h2>
    <p class="nota">Vida, fôlego e caminho guardados. Os bichos também voltaram.</p>
    <div id="fg-corpo" class="menu"></div>
    <button id="fg-sair" class="ir">Levantar</button>
  </div>
</div>

<div id="morte" class="tela" hidden>
  <h1 id="morte-tit"></h1>
  <p id="morte-sub"></p>
  <div id="morte-corpo" class="menu"></div>
</div>
<div id="veu"></div>

<script src="assets/barro/barro.js?v=3"></script>
<script src="assets/floresta/arte.js?v=3"></script>
<script src="js/som.js?v=3"></script>
<script src="js/dados.js?v=3"></script>
<script src="js/fase.js?v=3"></script>
<script src="js/motor.js?v=3"></script>
<script src="js/desenho.js?v=3"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
